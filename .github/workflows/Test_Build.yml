name: Test Build (SmsReceiver fix)

# 触发器：手动触发，或任意分支 push 时触发
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 与官方 Weekly_Build 保持一致，AGP 7.2.2 需要 JDK 11
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'
          java-package: jdk

      # 官方 release 签名需要私有 keystore，这里临时生成一个自签名 keystore，
      # 并写出 keystore/keystore.properties，让 app/build.gradle 能读到签名配置。
      - name: Generate test signing keystore
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/test.jks \
            -alias testkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass test123456 \
            -keypass test123456 \
            -dname "CN=Test, OU=Test, O=Test, L=Test, ST=Test, C=CN"
          printf "storeFile=$(pwd)/keystore/test.jks\nkeyAlias=testkey\nkeyPassword=test123456\nstorePassword=test123456\n" > keystore/keystore.properties

      # 尽力安装 android-33 / build-tools 33.0.1（本项目 compileSdk=33）。
      # 失败也不阻塞构建：AGP 自身会在构建时补装缺失的 SDK 组件。
      - name: Install Android SDK components (best effort)
        continue-on-error: true
        run: |
          set +e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT ANDROID_HOME=$ANDROID_HOME"
          echo "SDK dir: $SDK"
          ls -la "$SDK" || true
          SDKMGR=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMGR"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
            "$SDKMGR" --install "platforms;android-33" "build-tools;33.0.1" 2>&1 | tail -20
            "$SDKMGR" --list_installed 2>&1 | grep -E "android-33|33\.0\.1" || echo "!! android-33 / 33.0.1 未安装成功"
          else
            echo "!! 未找到 sdkmanager"
          fi

      # 编译。失败时把关键错误行转成 annotation 输出：
      # public 仓库可通过 check-runs annotations API 免登录读取，便于远程定位问题。
      - name: Build debug APK
        run: |
          set +e
          bash ./gradlew assembleDebug --no-daemon --stacktrace > /tmp/build.log 2>&1
          code=$?
          echo "gradle_exit=$code"
          echo "=========== 关键错误行 ==========="
          grep -nE "^e: |error:|FAILURE:|What went wrong|Could not (resolve|find|determine|download|install)|Caused by|> Task .* FAILED|Execution failed|Failed to install|SDK " /tmp/build.log | head -30
          echo "=========== 日志末尾 ==========="
          tail -50 /tmp/build.log
          grep -E "^e: |error:|FAILURE:|What went wrong|Could not (resolve|find|determine|download|install)|Caused by|> Task .* FAILED|Execution failed|Failed to install" /tmp/build.log \
            | head -25 \
            | while IFS= read -r l; do
                echo "::error title=gradle::$(printf '%s' "$l" | cut -c1-800)"
              done
          exit $code

      # 上传 universal 和 arm64-v8a 两种，真机安装二选一即可
      - name: Upload APK
        if: hashFiles('build/app/outputs/apk/debug/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: SmsForwarder-test
          path: |
            build/app/outputs/apk/debug/*universal*_debug.apk
            build/app/outputs/apk/debug/*arm64-v8a*_debug.apk

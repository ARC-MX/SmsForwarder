name: Test Build (SmsReceiver fix)

# 触发器：手动触发，或任意分支 push 时触发
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 与官方 Weekly_Build 保持一致，AGP 7.2.2 需要 JDK 11
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'
          java-package: jdk

      # 官方 release 签名需要私有 keystore，这里临时生成一个自签名 keystore，
      # 并写出 keystore/keystore.properties，让 app/build.gradle 能读到签名配置。
      - name: Generate test signing keystore
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/test.jks \
            -alias testkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass test123456 \
            -keypass test123456 \
            -dname "CN=Test, OU=Test, O=Test, L=Test, ST=Test, C=CN"
          printf "storeFile=$(pwd)/keystore/test.jks\nkeyAlias=testkey\nkeyPassword=test123456\nstorePassword=test123456\n" > keystore/keystore.properties
          cat keystore/keystore.properties

      # runner 预装的 SDK 只有 android-34+，本项目 compileSdk=33 且 buildToolsVersion=33.0.1，
      # 用官方 action 补齐 cmdline-tools 与所需组件（它会自动接受许可并加入 PATH）。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools platforms;android-33 build-tools;33.0.1'
          accept-android-sdk-licenses: true

      # 打印已安装组件，便于确认 android-33 / 33.0.1 就位
      - name: Verify Android SDK components
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --list_installed 2>&1 | grep -E "platforms;android-33|build-tools;33.0.1" || echo "!! 未找到 android-33 / 33.0.1"

      # 编 debug 包（debuggable，方便用 logcat 抓日志；isNeedPackage=true 时 debug 也会走 release 签名配置）
      - name: Build debug APK
        run: bash ./gradlew assembleDebug --no-daemon --stacktrace

      # 上传 universal 和 arm64-v8a 两种，真机安装二选一即可
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmsForwarder-test
          path: |
            build/app/outputs/apk/debug/*universal*_debug.apk
            build/app/outputs/apk/debug/*arm64-v8a*_debug.apk

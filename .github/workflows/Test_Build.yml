name: Test Build (SmsReceiver fix)

# 触发器：手动触发，或任意分支 push 时触发
on:
  workflow_dispatch:
  push:

# 发布 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 与官方 Weekly_Build 保持一致，AGP 7.2.2 需要 JDK 11
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'
          java-package: jdk

      # 官方 release 签名需要私有 keystore，这里临时生成一个自签名 keystore，
      # 并写出 keystore/keystore.properties，让 app/build.gradle 能读到签名配置。
      - name: Generate test signing keystore
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/test.jks \
            -alias testkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass test123456 \
            -keypass test123456 \
            -dname "CN=Test, OU=Test, O=Test, L=Test, ST=Test, C=CN"
          printf "storeFile=$(pwd)/keystore/test.jks\nkeyAlias=testkey\nkeyPassword=test123456\nstorePassword=test123456\n" > keystore/keystore.properties

      # 尽力安装 android-33 / build-tools 33.0.1（本项目 compileSdk=33）。
      # 失败也不阻塞构建：AGP 自身会在构建时补装缺失的 SDK 组件。
      - name: Install Android SDK components (best effort)
        continue-on-error: true
        run: |
          set +e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT ANDROID_HOME=$ANDROID_HOME"
          ls -la "$SDK" || true
          SDKMGR=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMGR"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
            "$SDKMGR" --install "platforms;android-33" "build-tools;33.0.1" 2>&1 | tail -20
            "$SDKMGR" --list_installed 2>&1 | grep -E "android-33|33\.0\.1" || echo "!! android-33 / 33.0.1 未安装成功"
          else
            echo "!! 未找到 sdkmanager"
          fi

      # 编译。失败时把关键错误行转成 annotation 输出：
      # public 仓库可通过 check-runs annotations API 免登录读取，便于远程定位问题。
      - name: Build debug APK
        run: |
          set +e
          bash ./gradlew assembleDebug --no-daemon --stacktrace > /tmp/build.log 2>&1
          code=$?
          echo "gradle_exit=$code"
          echo "=========== 关键错误行 ==========="
          grep -nE "^e: |error:|FAILURE:|What went wrong|Could not (resolve|find|determine|download|install)|Caused by|> Task .* FAILED|Execution failed|Failed to install" /tmp/build.log | head -30
          echo "=========== 日志末尾 ==========="
          tail -50 /tmp/build.log
          grep -E "^e: |error:|FAILURE:|What went wrong|Could not (resolve|find|determine|download|install)|Caused by|> Task .* FAILED|Execution failed|Failed to install" /tmp/build.log \
            | head -25 \
            | while IFS= read -r l; do
                echo "::error title=gradle::$(printf '%s' "$l" | cut -c1-800)"
              done
          exit $code

      # 上传 artifact（run 页面可下载）
      - name: Upload APK
        if: hashFiles('build/app/outputs/apk/debug/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: SmsForwarder-test
          path: |
            build/app/outputs/apk/debug/*universal*_debug.apk
            build/app/outputs/apk/debug/*arm64-v8a*_debug.apk

      # 发布 Release：public 仓库的 release 资源无需登录即可下载。
      # 固定 tag + --clobber，保证下载地址稳定、始终是最新一次构建。
      - name: Publish APK to Release
        if: hashFiles('build/app/outputs/apk/debug/*.apk') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="test-build-latest"
          APKS=$(ls build/app/outputs/apk/debug/*universal*_debug.apk build/app/outputs/apk/debug/*arm64-v8a*_debug.apk)
          echo "APKS:"; echo "$APKS"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" $APKS --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" $APKS \
              --repo "$GITHUB_REPOSITORY" \
              --title "Test Build (SmsReceiver fix)" \
              --notes "自动构建的测试包，用于验证 #773（Android 16/17 上 106 服务号含 UDH 长短信解析失败）。
          自签名（非官方签名），安装前请先卸载官方版本。commit: ${GITHUB_SHA}" \
              --prerelease
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'
